services:
  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr
    restart: unless-stopped
    # Host networking: the provider front (cf.vovu.top, behind Cloudflare) 403s one of
    # our address families at a time (IPv4 on 2026-10-01, then IPv6 by 2026-10-03), and a
    # bridge container only has one family to try. Sharing the host netns keeps both
    # families reachable; config/gai.conf then selects the working one (IPv4 today).
    # Port 9191 is bound directly on the host; `ports:` is not allowed with host mode.
    network_mode: host
    volumes:
      - ./dispatcharr/data:/data
      # DVR output lands on the big disk; Jellyfin can read it via /recordings
      - /mnt/storage/recordings:/data/recordings_host
      # Prefer IPv4 for provider egress — the provider 403s one address family at a time
      # and glibc would otherwise pick the (currently banned) IPv6. See config/gai.conf.
      - ./config/gai.conf:/etc/gai.conf:ro
    # Intel Iris Xe (TigerLake) — enables VAAPI stream profiles
    devices:
      - /dev/dri:/dev/dri
    environment:
      # Local time matters here: DVR schedules and the UI clock follow container TZ.
      # The host stays on UTC (it runs other production stacks).
      - TZ=America/Chicago
      - DISPATCHARR_ENV=aio
      - REDIS_HOST=localhost
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - DISPATCHARR_LOG_LEVEL=info
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9191/api/core/ping/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    # Host networking, same reason as Dispatcharr: the provider 403s one address family
    # at a time and the Xtream VOD sync (run by hand now) talks to the provider directly.
    # Sharing the host netns keeps both families reachable; config/gai.conf picks IPv4.
    # Ports 8096/7359 are bound directly on the host.
    network_mode: host
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /mnt/storage/recordings:/recordings
      - /mnt/storage/movies:/movies
      - /mnt/storage/tv:/tv
      # STRM files generated by the Xtream Library plugin (VOD/series from the provider)
      - /mnt/storage/vod-strm:/media/vod-strm
      # Same IPv4-first provider egress as Dispatcharr (see config/gai.conf).
      - ./config/gai.conf:/etc/gai.conf:ro
    # Intel Iris Xe (TigerLake) — enables VAAPI hardware transcoding
    devices:
      - /dev/dri:/dev/dri
    environment:
      # Guide/recording timers and logs read local time
      - TZ=America/Chicago
    # Keep the tuner/EPG URLs (http://dispatcharr:9191/...) unchanged: on the shared host
    # netns "dispatcharr" is just loopback, where the host-networked Dispatcharr listens.
    extra_hosts:
      - "dispatcharr:127.0.0.1"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Watch-state sync: keeps Jellyfin watched/progress state in sync
  # (multi-user, webhook + scheduled import). WebUI: http://localhost:8081
  # First run: create system user in the UI, then add Jellyfin backend
  # (two-way sync) and point Jellyfin webhooks at http://watchstate:8081/ws/{key}
  watchstate:
    image: ghcr.io/arabcoders/watchstate:latest
    container_name: watchstate
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8081:8080"
    volumes:
      - ./watchstate/data:/config
    environment:
      - TZ=America/Chicago
    networks:
      - media-net

  # Cline <-> Telegram bridge: Telegram messages to the bot become headless
  # Cline sessions with cwd=/workspace, so the stack can be driven (and
  # debugged, and changed) from a phone. Token + allowed user id come from
  # .env (gitignored). Provider auth is seeded from the host's ~/.cline
  # (read-only mount) into the writable state volume — no key in any file.
  # See cline-telegram/entrypoint.sh and docs/reference.md (Telegram bridge).
  cline-telegram:
    build: ./cline-telegram
    image: iptv-stack-cline-telegram
    container_name: cline-telegram
    restart: unless-stopped
    # Host networking: sessions reach Kodi at k5320.lan:8080 (mDNS name —
    # bridge DNS cannot resolve .lan), Dispatcharr on :9191, and the LAN.
    network_mode: host
    # Match the image's `node` user to the host user that owns the repo.
    user: "1000"
    # Read-only host docker group, so sessions can `docker exec` into
    # dispatcharr to run the repo's scripts (how they execute today).
    group_add:
      - "983"
    env_file:
      - .env
    volumes:
      # The repo, RW: sessions edit code, run scripts, and commit.
      - .:/workspace
      # Runtime state: seeded cline config (provider secrets) + sessions.
      - ./cline-telegram/state:/state
      # Host provider auth/model config, read-only; entrypoint seeds a copy.
      - ${HOME}/.cline:/cline-config:ro
      # Repo scripts run via docker exec into the dispatcharr container.
      - /var/run/docker.sock:/var/run/docker.sock
      # IPv4-first provider egress for provider probes during debug sessions
      # (same reason as Dispatcharr; see config/gai.conf).
      - ./config/gai.conf:/etc/gai.conf:ro
    environment:
      - TZ=America/Chicago
    stop_grace_period: 30s

networks:
  # Dispatcharr and Jellyfin now run on host networking; only watchstate is left here.
  media-net:
    name: media-net
    driver: bridge
