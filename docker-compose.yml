services:
  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr
    restart: unless-stopped
    # Host networking: the provider front (cf.vovu.top, behind Cloudflare) answers our
    # IPv4 egress with 403 but serves IPv6, and a bridge container has no IPv6 route.
    # Sharing the host netns gives Dispatcharr the host's working IPv6 path. Port 9191
    # is therefore bound directly on the host; `ports:` is not allowed with host mode.
    network_mode: host
    volumes:
      - ./dispatcharr/data:/data
      # DVR output lands on the big disk; Jellyfin can read it via /recordings
      - /mnt/storage/recordings:/data/recordings_host
    # Intel Iris Xe (TigerLake) — enables VAAPI stream profiles
    devices:
      - /dev/dri:/dev/dri
    environment:
      # Local time matters here: DVR schedules and the UI clock follow container TZ.
      # The host stays on UTC (it runs other production stacks).
      - TZ=America/Chicago
      - DISPATCHARR_ENV=aio
      - REDIS_HOST=localhost
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - DISPATCHARR_LOG_LEVEL=info
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9191/api/core/ping/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
      # Client auto-discovery
      - "7359:7359/udp"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /mnt/storage/recordings:/recordings
      - /mnt/storage/movies:/movies
      - /mnt/storage/tv:/tv
      # STRM files generated by the Xtream Library plugin (VOD/series from the provider)
      - /mnt/storage/vod-strm:/media/vod-strm
    # Intel Iris Xe (TigerLake) — enables VAAPI hardware transcoding
    devices:
      - /dev/dri:/dev/dri
    environment:
      # Guide/recording timers and logs read local time
      - TZ=America/Chicago
    # Dispatcharr moved to host networking, so its media-net alias is gone. 172.18.0.1
    # is the media-net gateway (the host), where Dispatcharr's 9191 is now bound. This
    # keeps Jellyfin's tuner/EPG URLs (http://dispatcharr:9191/...) working unchanged.
    extra_hosts:
      - "dispatcharr:172.18.0.1"
    networks:
      - media-net
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Watch-state sync: keeps Jellyfin watched/progress state in sync
  # (multi-user, webhook + scheduled import). WebUI: http://localhost:8081
  # First run: create system user in the UI, then add Jellyfin backend
  # (two-way sync) and point Jellyfin webhooks at http://watchstate:8081/ws/{key}
  watchstate:
    image: ghcr.io/arabcoders/watchstate:latest
    container_name: watchstate
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8081:8080"
    volumes:
      - ./watchstate/data:/config
    environment:
      - TZ=America/Chicago
    networks:
      - media-net

networks:
  media-net:
    name: media-net
    driver: bridge
    # Pinned so the gateway (172.18.0.1) that Jellyfin's `extra_hosts` alias uses to
    # reach the host-networked Dispatcharr is deterministic across re-creates.
    ipam:
      config:
        - subnet: 172.18.0.0/16
