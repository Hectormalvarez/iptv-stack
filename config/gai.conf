# Force IPv4-first name resolution for the provider egress.
#
# Why: the provider front (cf.vovu.top, behind Cloudflare) intermittently 403s one of
# this host's address families. 2026-10-01 it blocked IPv4 (IPv6 worked); by 2026-10-03
# it had flipped and was blocking IPv6 while IPv4 served normally (web root 401, live
# URLs 302). glibc sorts AAAA before A, so a host-networked container kept hitting the
# banned family and every stream failed with "403 Forbidden".
#
# `precedence ::ffff:0:0/96 100` raises IPv4 (as IPv4-mapped) above global IPv6 in the
# RFC 3484 sort, so getaddrinfo returns A records first and ffmpeg/curl connect over IPv4.
# Mounted read-only over /etc/gai.conf in docker-compose.yml.
precedence ::ffff:0:0/96  100
