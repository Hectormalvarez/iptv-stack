# Provider egress: name-resolution preference for cf.vovu.top.
#
# Why this file exists: the provider front (Cloudflare in front of cf.vovu.top)
# intermittently 403s ONE of this host's address families at a time, and the banned
# family FLIPS. Observed so far:
#
#   2026-10-01  IPv4 blocked, IPv6 served   -> containers moved to network_mode: host
#   2026-10-03  IPv6 blocked, IPv4 served   -> `precedence ::ffff:0:0/96 100` added
#   2026-10-25  IPv4 blocked again (403 web, 000 on connect), IPv6 serving
#                                            (401 web, 200 + video/mp2t streams)
#
# So do NOT hard-code a family. This file currently applies NO override, which leaves
# glibc's RFC 3484 default in place: AAAA (IPv6) wins over A when the host holds a
# global IPv6 address — which it does (2603:8080:... on the host, and the containers
# share the host netns).
#
# If the ban flips back to IPv6, force IPv4 again by appending:
#     precedence ::ffff:0:0/96  100
# then restart BOTH containers — glibc caches gai.conf per process, so a running
# container keeps the old order until it restarts:
#     docker restart dispatcharr jellyfin
#
# Mounted read-only over /etc/gai.conf in docker-compose.yml. Verify which family the
# container would actually pick with:
#     docker exec dispatcharr sh -lc 'getent ahosts cf.vovu.top | head -1'

